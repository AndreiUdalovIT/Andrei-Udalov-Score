name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to a PR cancels its outdated run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are not needed in CI.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      # Takes the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps
      # Playwright builds and starts the app once for all browser projects.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
